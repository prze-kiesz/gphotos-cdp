version: '3.8'

services:
  gphotos-cdp:
    build: .
    container_name: gphotos-cdp
    restart: unless-stopped
    
    # Security options for Chrome
    security_opt:
      - seccomp:unconfined
    
    # Shared memory size (important for Chrome)
    shm_size: '2gb'
    
    # Environment variables
    environment:
      # Log level: debug, info, warn, error
      - LOGLEVEL=${LOGLEVEL:-info}
      
      # Number of concurrent downloads
      - WORKERS=${WORKERS:-2}
      
      # Optional: date range filters (YYYY-MM-DD)
      # - FROM_DATE=2024-01-01
      # - TO_DATE=2024-12-31
      
      # Optional: specific album ID
      # - ALBUM_ID=
      
      # JSON logging for better parsing
      - JSON_LOG=${JSON_LOG:-false}
    
    volumes:
      # Downloaded photos (persistent)
      - ./photos:/data/photos
      
      # Chrome profile (persistent, keeps login session)
      - ./chrome-profile:/data/profile
      
      # Optional: custom locales file
      # - ./locales.yaml:/usr/local/bin/locales.yaml:ro
    
    # Command override with environment variables
    command: >
      gphotos-cdp
      -profile /data/profile
      -dldir /data/photos
      -headless
      -workers ${WORKERS:-2}
      -loglevel ${LOGLEVEL:-info}
      ${JSON_LOG:+-json}
      ${FROM_DATE:+-from ${FROM_DATE}}
      ${TO_DATE:+-to ${TO_DATE}}
      ${ALBUM_ID:+-album ${ALBUM_ID}}
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    
    # Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f gphotos-cdp || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Chrome Remote Debugging service
  # Use this to connect from your local browser for testing/login
  chrome-debug:
    build: .
    container_name: chrome-debug
    restart: unless-stopped
    
    # Security options for Chrome
    security_opt:
      - seccomp:unconfined
    
    # Shared memory size (important for Chrome)
    shm_size: '2gb'
    
    ports:
      # Chrome DevTools Protocol port
      - "9222:9222"
    
    volumes:
      # Chrome profile (persistent, keeps login session)
      - ./chrome-profile:/data/profile
    
    environment:
      - CHROME_PATH=/usr/bin/chromium
      - DISPLAY=:99
    
    # Run Chrome in remote debugging mode with socat proxy
    command: >
      /bin/bash -c "
      rm -f /data/profile/SingletonLock /data/profile/*/SingletonLock &&
      /usr/bin/chromium
      --remote-debugging-port=9223
      --user-data-dir=/data/profile
      --no-first-run
      --no-default-browser-check
      --disable-background-networking
      --disable-background-timer-throttling
      --disable-backgrounding-occluded-windows
      --disable-breakpad
      --disable-client-side-phishing-detection
      --disable-component-extensions-with-background-pages
      --disable-default-apps
      --disable-dev-shm-usage
      --disable-extensions
      --disable-features=TranslateUI
      --disable-hang-monitor
      --disable-ipc-flooding-protection
      --disable-popup-blocking
      --disable-prompt-on-repost
      --disable-renderer-backgrounding
      --disable-sync
      --metrics-recording-only
      --no-sandbox
      --headless=new
      --disable-gpu
      --window-size=1920,1080
      about:blank &
      sleep 2 &&
      socat TCP-LISTEN:9222,fork,reuseaddr TCP:127.0.0.1:9223
      "
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Healthcheck
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9222/json/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Optional: network configuration
networks:
  default:
    name: gphotos-network
