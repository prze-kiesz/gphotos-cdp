# Example: Polish locale configuration
# This file shows what Learning Mode generates
# Copy this content to locales.yaml to use it

pl:
  selectAllPhotosLabel:
    matchType: startsWith
    matchValue: "Wybierz wszystkie zdjęcia z"
  fileNameLabel:
    matchType: startsWith
    matchValue: "Nazwa pliku:"
  dateLabel:
    matchType: startsWith
    matchValue: "Data wykonania zdjęcia:"
  today: "Dzisiaj"
  yesterday: "Wczoraj"
  timeLabel:
    matchType: startsWith
    matchValue: "Godzina wykonania zdjęcia:"
  tzLabel:
    matchType: startsWith
    matchValue: "GMT"
  viewPreviousPhotoMatch:
    matchType: equals
    matchValue: "Wyświetl poprzednie zdjęcie"
  moreOptionsLabel:
    matchType: equals
    matchValue: "Więcej opcji"
  downloadLabel:
    matchType: equals
    matchValue: "Pobierz - Shift+D"
  downloadOriginalLabel:
    matchType: equals
    matchValue: "Pobierz oryginał"
  openInfoMatch:
    matchType: equals
    matchValue: "Otwórz informacje"
  videoStillProcessingDialogLabel:
    matchType: startsWith
    matchValue: "Film wideo jest wciąż przetwarzany"
  videoStillProcessingStatusText: "Film wideo jest wciąż przetwarzany i można go pobrać później"
  noWebpageFoundText: "Nie znaleziono strony internetowej dla tego adresu:"
  notNow: "Nie teraz"
  shortDayNames:
    - "niedz."
    - "pon."
    - "wt."
    - "śr."
    - "czw."
    - "pt."
    - "sob."
  longDayNames:
    - "niedziela"
    - "poniedziałek"
    - "wtorek"
    - "środa"
    - "czwartek"
    - "piątek"
    - "sobota"
  shortMonthNames:
    - "sty"
    - "lut"
    - "mar"
    - "kwi"
    - "maj"
    - "cze"
    - "lip"
    - "sie"
    - "wrz"
    - "paź"
    - "lis"
    - "gru"
